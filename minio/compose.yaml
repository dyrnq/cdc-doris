# version: '3.7'

# Settings and configurations that are common for all containers
x-minio-common: &minio-common
  image: quay.io/minio/minio:RELEASE.2024-11-07T00-52-20Z
  command: server --console-address ":9001" http://minio{1...4}/data{1...2}
  expose:
    - "9000"
    - "9001"
  # environment:
    # MINIO_ROOT_USER: minioadmin
    # MINIO_ROOT_PASSWORD: minioadmin
  healthcheck:
    test: ["CMD", "mc", "ready", "local"]
    interval: 5s
    timeout: 5s
    retries: 5
# starts 4 docker containers running minio server instances.
# using nginx reverse proxy, load balancing, you can access
# it through port 9000.
services:
  minio1:
    <<: *minio-common
    hostname: minio1
    networks:
      canal:
    volumes:
      - data1-1:/data1
      - data1-2:/data2

  minio2:
    <<: *minio-common
    hostname: minio2
    networks:
      canal:
    volumes:
      - data2-1:/data1
      - data2-2:/data2

  minio3:
    <<: *minio-common
    hostname: minio3
    networks:
      canal:
    volumes:
      - data3-1:/data1
      - data3-2:/data2

  minio4:
    <<: *minio-common
    hostname: minio4
    networks:
      canal:
    volumes:
      - data4-1:/data1
      - data4-2:/data2

  nginx:
    image: nginx:1.26.2-alpine
    hostname: nginx
    networks:
      canal:
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      minio1:
        condition: service_healthy
      minio2:
        condition: service_healthy
      minio3:
        condition: service_healthy
      minio4:
        condition: service_healthy

  mc:
    image: minio/mc
    container_name: mc
    networks:
      canal:
    depends_on:
      nginx:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "

      /usr/bin/mc alias set myminio http://192.168.56.200:9000 minioadmin minioadmin;
      /usr/bin/mc admin user svcacct add --access-key "u5SybesIDVX9b6Pk" --secret-key "lOpH1v7kdM6H8NkPu1H2R6gLc9jcsmWM" myminio minioadmin 2>/dev/null || true;
      sleep 5s;
      /usr/bin/mc mb myminio/flink 2>/dev/null || true;
      /usr/bin/mc mb myminio/flink-state 2>/dev/null || true;
      tail -f /dev/null
      "


## By default this config uses default local driver,
## For custom volumes replace with volume driver configuration.
volumes:
  data1-1:
    external: true
    name: minio1_volume1
  data1-2:
    external: true
    name: minio1_volume2
  data2-1:
    external: true
    name: minio2_volume1
  data2-2:
    external: true
    name: minio2_volume2
  data3-1:
    external: true
    name: minio3_volume1
  data3-2:
    external: true
    name: minio3_volume2
  data4-1:
    external: true
    name: minio4_volume1
  data4-2:
    external: true
    name: minio4_volume2

networks:
  canal:
    external: true